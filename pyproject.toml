[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sysu-rd03v2-campus-router"
version = "0.2.0"
description = "SYSU Shenzhen campus stock-router case study and header-only EAPOL diagnostics"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
